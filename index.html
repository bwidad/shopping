<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>MARKET</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
    font-family:Arial;
    margin:0;
    background:#f1f3f6;
}

/* HEADER */

header{
    background:linear-gradient(90deg,#ff6f00,#ff9800);
    color:white;
    padding:25px;
    text-align:center;
}

h1{
    margin:0;
    font-size:42px;
    letter-spacing:5px;
}

/* CONTAINER */

.container{
    max-width:1100px;
    margin:auto;
    padding:20px;
}

/* ACCORDION */

.accordion{
    margin-bottom:15px;
    border-radius:8px;
    overflow:hidden;
    box-shadow:0 3px 10px rgba(0,0,0,0.2);
}

.accordion-header{
    padding:15px;
    color:white;
    font-size:20px;
    cursor:pointer;
}

/* COLORS */

.chocolat{background:#5d4037;}
.biscuit{background:#1565c0;}
.chips{background:#2e7d32;}
.boisson{background:#6a1b9a;}

/* CONTENT */

.content{
    display:none;
    background:white;
    padding:15px;
}

/* PRODUCT */

.product{
    display:flex;
    align-items:center;
    background:#f9f9f9;
    margin-bottom:10px;
    padding:10px;
    border-radius:6px;
}

.product img{
    width:60px;
    height:60px;
    object-fit:contain;
    margin-right:15px;
}

.product h3{
    margin:0;
}

.product p{
    margin:3px 0;
    font-size:14px;
    color:#555;
}

/* FOOTER */

footer{
    background:#222;
    color:white;
    text-align:center;
    padding:20px;
}

/* LOADER */

.loader{
    text-align:center;
    padding:20px;
    font-size:18px;
    color:#666;
}

.error{
    text-align:center;
    padding:20px;
    color:red;
}

</style>

</head>
<body>

<header>
<h1>MARKET</h1>
<p>Catalogue des marques vendues au Maroc</p>
</header>

<div class="container">

<div class="accordion">
<div class="accordion-header chocolat" onclick="toggle('chocolatList')">
🍫 Chocolat
</div>
<div id="chocolatList" class="content"></div>
</div>

<div class="accordion">
<div class="accordion-header biscuit" onclick="toggle('biscuitList')">
🍪 Biscuit
</div>
<div id="biscuitList" class="content"></div>
</div>

<div class="accordion">
<div class="accordion-header chips" onclick="toggle('chipsList')">
🥔 Chips
</div>
<div id="chipsList" class="content"></div>
</div>

<div class="accordion">
<div class="accordion-header boisson" onclick="toggle('boissonList')">
🥤 Boisson
</div>
<div id="boissonList" class="content"></div>
</div>

<div id="status" class="loader">
Chargement des produits...
</div>

</div>

<footer>
© MARKET Maroc 2026
</footer>

<script>

/* AZURE FUNCTION URL */

const API_URL = "https://widadfunction-cjf0fzc4hqc4bjg7.canadacentral-01.azurewebsites.net/api/missionV1?code=5YuBIGLxlL0EoZqQw49t1fX5T7MxAueeK0Ohifz5dueYAzFuvETAng==";


/* LOAD PRODUCTS FROM AZURE */

async function loadProducts(){

    try{

        const response = await fetch(API_URL);

        if(!response.ok)
            throw new Error("Erreur HTTP " + response.status);

        const products = await response.json();

        displayProducts(products);

        document.getElementById("status").innerHTML =
            "Produits chargés : " + products.length;

    }
    catch(error){

        console.error(error);

        document.getElementById("status").innerHTML =
            "Erreur de chargement depuis Azure Function";

        document.getElementById("status").className = "error";

    }

}


/* DISPLAY PRODUCTS */

function displayProducts(products){

    // reset
    document.getElementById("chocolatList").innerHTML="";
    document.getElementById("biscuitList").innerHTML="";
    document.getElementById("chipsList").innerHTML="";
    document.getElementById("boissonList").innerHTML="";

    products.forEach(product=>{

        const html = `
        <div class="product">
            <img src="${product.image}" onerror="this.src='https://via.placeholder.com/60'">
            <div>
                <h3>${product.name}</h3>
                <p>${product.company}</p>
            </div>
        </div>
        `;

        const container =
            document.getElementById(product.category + "List");

        if(container)
            container.innerHTML += html;

    });

}


/* ACCORDION TOGGLE */

function toggle(id){

    const el = document.getElementById(id);

    if(el.style.display === "block")
        el.style.display = "none";
    else
        el.style.display = "block";

}


/* INIT */

loadProducts();

</script>

</body>
</html>
