<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Malls Maroc</title>

<!-- Leaflet -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.5/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>

<script src="https://unpkg.com/leaflet@1.9.5/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root{
  --primary:#0a9396;
  --secondary:#ee6c4d;
  --dark:#023047;
}

body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background: linear-gradient(135deg,#a8edea,#fed6e3);
}

header{
  background:var(--dark);
  color:white;
  padding:1rem;
  text-align:center;
}

.container{
  display:flex;
  height:calc(100vh - 80px);
}

.sidebar{
  width:340px;
  background:rgba(255,255,255,0.95);
  padding:1rem;
  overflow-y:auto;
  box-shadow:2px 0 15px rgba(0,0,0,0.15);
}

.controls input,
.controls select{
  width:100%;
  padding:8px;
  margin-bottom:8px;
  border-radius:6px;
  border:1px solid #ccc;
}

.controls label{
  display:block;
  margin-bottom:5px;
}

.mall-card{
  background:white;
  border-radius:10px;
  padding:10px;
  margin-bottom:10px;
  box-shadow:0 4px 10px rgba(0,0,0,0.15);
  cursor:pointer;
  transition:0.3s;
}

.mall-card:hover{
  transform:translateY(-4px);
  box-shadow:0 6px 20px rgba(0,0,0,0.25);
}

.main{
  flex:1;
  position:relative;
}

#map{
  height:100%;
}

.detail-panel{
  position:absolute;
  top:50px;
  left:50%;
  transform:translateX(-50%);
  background:white;
  width:400px;
  padding:20px;
  border-radius:12px;
  box-shadow:0 8px 30px rgba(0,0,0,0.3);
  display:none;
  z-index:1000;
}

.detail-panel h2{
  margin-top:0;
}

.detail-panel button{
  background:var(--primary);
  color:white;
  border:none;
  padding:6px 10px;
  border-radius:6px;
  cursor:pointer;
}
</style>
</head>
<body>

<header>
<h1>Dashboard Malls & Marjane Maroc</h1>
</header>

<div class="container">

<div class="sidebar">
<div class="controls">
<input type="text" id="search" placeholder="Rechercher un mall...">
<select id="cityFilter"><option value="">Toutes les villes</option></select>
<label><input type="checkbox" id="showMalls" checked> Malls</label>
<label><input type="checkbox" id="showMarjane" checked> Marjane</label>
</div>
<div id="mall-list"></div>
</div>

<div class="main">
<div id="map"></div>
</div>

</div>

<div class="detail-panel" id="detail-panel">
<button id="close-detail">Fermer</button>
<h2 id="mall-title"></h2>
<p id="mall-city"></p>
<p id="mall-address"></p>
<p><strong>Coordonnées:</strong> <span id="mall-coords"></span></p>
<h3>Magasins</h3>
<ul id="stores"></ul>
<h3>Fast Food</h3>
<ul id="fastfoods"></ul>
</div>

<script>

// DATA
const malls = [
{ id:1,name:"Morocco Mall",city:"Casablanca",location:{address:"Boulevard de Biarritz",lat:33.5731,lng:-7.7076},stores:["Zara","H&M","Nike"],fastfood:["McDonald's","KFC"],type:"mall"},
{ id:2,name:"Mega Mall",city:"Rabat",location:{address:"Avenue Mohamed VI",lat:34.0209,lng:-6.8416},stores:["LC Waikiki","Carrefour"],fastfood:["Burger King"],type:"mall"},
{ id:3,name:"Menara Mall",city:"Marrakech",location:{address:"Avenue Mohammed VI",lat:31.6145,lng:-8.0216},stores:["Puma","Zara"],fastfood:["KFC","Pizza Hut"],type:"mall"},
{ id:4,name:"Marjane Casablanca",city:"Casablanca",location:{address:"Ain Sebaa",lat:33.6167,lng:-7.575},stores:["Marjane","Electro"],fastfood:["KFC"],type:"marjane"}
];

const mallListEl=document.getElementById("mall-list");
const searchInput=document.getElementById("search");
const cityFilter=document.getElementById("cityFilter");
const showMalls=document.getElementById("showMalls");
const showMarjane=document.getElementById("showMarjane");

const detailPanel=document.getElementById("detail-panel");
const closeDetail=document.getElementById("close-detail");

let map,markerCluster;

[...new Set(malls.map(m=>m.city))].forEach(city=>{
const opt=document.createElement("option");
opt.value=city;
opt.textContent=city;
cityFilter.appendChild(opt);
});

function renderMalls(){
mallListEl.innerHTML="";
const search=searchInput.value.toLowerCase();
const selectedCity=cityFilter.value;

const filtered=malls.filter(m=>
m.name.toLowerCase().includes(search) &&
(selectedCity===""||m.city===selectedCity) &&
((m.type==="mall"&&showMalls.checked)||(m.type==="marjane"&&showMarjane.checked))
);

filtered.forEach(m=>{
const card=document.createElement("div");
card.className="mall-card";
card.innerHTML=`<strong>${m.name}</strong><br>${m.city}<br>${m.stores.length} magasins - ${m.fastfood.length} fast food`;
card.onclick=()=>showDetail(m);
mallListEl.appendChild(card);
});

renderMap(filtered);
}

function renderMap(filteredMalls){
if(map) map.remove();
map=L.map('map').setView([33.5731,-7.7076],5);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);
markerCluster=L.markerClusterGroup();

filteredMalls.forEach(m=>{
const container=document.createElement("div");
container.style.width="120px";
container.style.height="80px";
container.style.transition="0.3s";

const canvas=document.createElement("canvas");
canvas.width=120;
canvas.height=80;
container.appendChild(canvas);

const chart=new Chart(canvas.getContext("2d"),{
type:'doughnut',
data:{
labels:['Magasins','FastFood'],
datasets:[{data:[m.stores.length,m.fastfood.length],
backgroundColor:['#0a9396','#ee6c4d'],
borderWidth:0}]
},
options:{
responsive:false,
cutout:'60%',
plugins:{legend:{display:false}}
}
});

container.addEventListener("mouseenter",()=>{
container.style.transform="scale(1.2)";
container.style.filter="drop-shadow(0 8px 15px rgba(0,0,0,0.4))";
});

container.addEventListener("mouseleave",()=>{
container.style.transform="scale(1)";
container.style.filter="none";
});

const icon=L.divIcon({html:container.outerHTML,className:"",iconSize:[120,80],iconAnchor:[60,40]});

const marker=L.marker([m.location.lat,m.location.lng],{icon:icon})
.bindPopup(`<b>${m.name}</b><br>${m.location.address}`);

markerCluster.addLayer(marker);
});

map.addLayer(markerCluster);
}

function showDetail(m){
detailPanel.style.display="block";
document.getElementById("mall-title").textContent=m.name;
document.getElementById("mall-city").textContent="Ville: "+m.city;
document.getElementById("mall-address").textContent="Adresse: "+m.location.address;
document.getElementById("mall-coords").textContent=`${m.location.lat}, ${m.location.lng}`;

const stores=document.getElementById("stores");
const fastfoods=document.getElementById("fastfoods");
stores.innerHTML="";
fastfoods.innerHTML="";

m.stores.forEach(s=>stores.innerHTML+=`<li>${s}</li>`);
m.fastfood.forEach(f=>fastfoods.innerHTML+=`<li>${f}</li>`);

map.setView([m.location.lat,m.location.lng],15);
}

searchInput.addEventListener("input",renderMalls);
cityFilter.addEventListener("change",renderMalls);
showMalls.addEventListener("change",renderMalls);
showMarjane.addEventListener("change",renderMalls);
closeDetail.addEventListener("click",()=>detailPanel.style.display="none");

renderMalls();

</script>
</body>
</html>
