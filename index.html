<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Malls Maroc - API</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.5/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>

<style>
:root{
  --primary:#0a9396;
  --dark:#023047;
  --text:#222;
  --white:#fff;
}

body{
  background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
  color: var(--text);
  font-family:'Segoe UI',Tahoma,sans-serif;
  margin:0;
  padding:0;
}

header{
  background: var(--dark);
  color: var(--white);
  padding:1rem;
  text-align:center;
}

.container{
  display:flex;
  flex-direction:row;
  height:calc(100vh - 80px);
}

.sidebar{
  width:350px;
  overflow-y:auto;
  background: rgba(255,255,255,0.95);
  padding:1rem;
  box-shadow:2px 0 12px rgba(0,0,0,0.15);
}

.main{
  flex:1;
  display:flex;
  flex-direction:column;
  position:relative;
}

.controls{
  display:flex;
  gap:0.5rem;
  flex-wrap:wrap;
  margin-bottom:0.5rem;
}

.controls input,.controls select{
  padding:0.5rem;
  border:1px solid #aaa;
  border-radius:5px;
}

#mall-list{
  display:grid;
  gap:0.8rem;
}

.mall-card{
  background: rgba(255,255,255,0.95);
  border-radius:8px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.2);
  cursor:pointer;
  transition:0.3s;
  overflow:hidden;
}

.mall-card:hover{
  transform:translateY(-2px);
}

.mall-card img{
  width:100%;
  height:100px;
  object-fit:cover;
}

.mall-card .info{
  padding:0.5rem;
}

.bar-container{
  display:flex;
  height:5px;
  width:100%;
  background:#eee;
  border-radius:3px;
  overflow:hidden;
  margin-top:3px;
}

.bar-fill{
  background:var(--primary);
  height:100%;
}

#map{
  flex:1;
}

.detail-panel{
  position:absolute;
  top:60px;
  left:50%;
  transform:translateX(-50%);
  width:90%;
  max-width:600px;
  background:white;
  padding:1rem;
  border-radius:10px;
  box-shadow:0 6px 25px rgba(0,0,0,0.3);
  display:none;
  z-index:1000;
}

button{
  padding:0.4rem 0.8rem;
  border:none;
  background:var(--primary);
  color:white;
  border-radius:5px;
  cursor:pointer;
}

footer{
  text-align:center;
  padding:0.5rem;
  background:#ddd;
}

@media(max-width:900px){
  .container{flex-direction:column;height:auto;}
  .sidebar{width:100%;max-height:300px;}
  .main{height:400px;}
}
</style>
</head>
<body>

<header>
<h1>Dashboard Malls Maroc</h1>
<p>Données chargées depuis API Azure</p>
</header>

<div class="container">

<div class="sidebar">

<div class="controls">
<input type="text" id="search" placeholder="Rechercher...">
<select id="cityFilter">
<option value="">Toutes les villes</option>
</select>
</div>

<div id="mall-list"></div>

</div>

<div class="main">
<div id="map"></div>
</div>

</div>

<div class="detail-panel" id="detail-panel">

<button id="close-detail">Fermer</button>

<h2 id="mall-title"></h2>

<p id="mall-city"></p>

<p id="mall-address"></p>

<p id="mall-coords"></p>

<h3>Magasins:</h3>

<ul id="stores"></ul>

</div>

<footer>© 2026 Dashboard API</footer>

<script src="https://unpkg.com/leaflet@1.9.5/dist/leaflet.js"></script>

<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

<script>

const API_URL =
"https://mall-back-hxfbcrhuh7bnd7ge.westeurope-01.azurewebsites.net/api/malls";

let malls = [];

const mallListEl=document.getElementById("mall-list");
const searchInput=document.getElementById("search");
const cityFilter=document.getElementById("cityFilter");

const detailPanel=document.getElementById("detail-panel");
const closeDetail=document.getElementById("close-detail");

const mallTitle=document.getElementById("mall-title");
const mallCity=document.getElementById("mall-city");
const mallAddress=document.getElementById("mall-address");
const mallCoords=document.getElementById("mall-coords");
const storesEl=document.getElementById("stores");

let map;
let markerCluster;

async function loadMalls(){

try{

const response=await fetch(API_URL);

const data=await response.json();

malls=data;

initCityFilter();

renderMalls();

}

catch(error){

console.error(error);

alert("Erreur chargement API");

}

}

function initCityFilter(){

cityFilter.innerHTML='<option value="">Toutes les villes</option>';

[...new Set(malls.map(m=>m.city))].forEach(city=>{

const opt=document.createElement("option");

opt.value=city;

opt.textContent=city;

cityFilter.appendChild(opt);

});

}

function renderMalls(){

mallListEl.innerHTML="";

const search=searchInput.value.toLowerCase();

const selectedCity=cityFilter.value;

const filtered=malls.filter(m=>

m.name.toLowerCase().includes(search)

&&

(selectedCity===""||m.city===selectedCity)

);

filtered.forEach(m=>{

const card=document.createElement("div");

card.className="mall-card";

card.innerHTML=

`<img src="${m.image}">

<div class="info">

<h3>${m.name}</h3>

<p>${m.city}</p>

<p>${m.stores.length} magasins</p>

<div class="bar-container">

<div class="bar-fill"

style="width:${Math.min(m.stores.length*10,100)}%">

</div>

</div>

</div>`;

card.onclick=()=>showDetail(m);

mallListEl.appendChild(card);

});

renderMap(filtered);

}

function renderMap(filtered){

if(map) map.remove();

map=L.map('map').setView([33.5731,-7.7076],6);

L.tileLayer(

'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png'

).addTo(map);

markerCluster=L.markerClusterGroup();

filtered.forEach(m=>{

const marker=L.marker(

[m.location.lat,m.location.lng]

)

.bindPopup(

`<b>${m.name}</b><br>${m.location.address}`

);

markerCluster.addLayer(marker);

});

map.addLayer(markerCluster);

}

function showDetail(m){

detailPanel.style.display="block";

mallTitle.textContent=m.name;

mallCity.textContent="Ville: "+m.city;

mallAddress.textContent="Adresse: "+m.location.address;

mallCoords.textContent=

`Lat: ${m.location.lat}

Lng: ${m.location.lng}`;

storesEl.innerHTML="";

m.stores.forEach(s=>{

const li=document.createElement("li");

li.textContent=s;

storesEl.appendChild(li);

});

map.setView([m.location.lat,m.location.lng],15);

}

searchInput.addEventListener("input",renderMalls);

cityFilter.addEventListener("change",renderMalls);

closeDetail.onclick=()=>detailPanel.style.display="none";

loadMalls();

</script>

</body>
</html>
