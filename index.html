<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Malls Maroc</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.5/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>

<script src="https://unpkg.com/leaflet@1.9.5/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root{
  --primary:#0a9396;
  --secondary:#ee6c4d;
  --dark:#023047;
}

body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background: linear-gradient(135deg,#a8edea,#fed6e3);
}

header{
  background:var(--dark);
  color:white;
  padding:1rem;
  text-align:center;
}

.container{
  display:flex;
  height:calc(100vh - 80px);
}

.sidebar{
  width:340px;
  background:rgba(255,255,255,0.95);
  padding:1rem;
  overflow-y:auto;
  box-shadow:2px 0 15px rgba(0,0,0,0.15);
}

.controls input,
.controls select{
  width:100%;
  padding:8px;
  margin-bottom:8px;
  border-radius:6px;
  border:1px solid #ccc;
}

.mall-card{
  background:white;
  border-radius:10px;
  padding:10px;
  margin-bottom:10px;
  box-shadow:0 4px 10px rgba(0,0,0,0.15);
  cursor:pointer;
  transition:0.3s;
}

.mall-card:hover{
  transform:translateY(-4px);
}

.main{
  flex:1;
  position:relative;
}

#map{
  height:100%;
}

.detail-panel{
  position:absolute;
  top:50px;
  left:50%;
  transform:translateX(-50%);
  background:white;
  width:420px;
  max-height:80vh;
  overflow-y:auto;
  padding:20px;
  border-radius:12px;
  box-shadow:0 8px 30px rgba(0,0,0,0.3);
  display:none;
  z-index:1000;
}

.detail-panel button{
  background:var(--primary);
  color:white;
  border:none;
  padding:6px 10px;
  border-radius:6px;
  cursor:pointer;
}
</style>
</head>
<body>

<header>
<h1>Dashboard Malls & Marjane Maroc</h1>
</header>

<div class="container">

<div class="sidebar">
<input type="text" id="search" placeholder="Rechercher un mall...">
<select id="cityFilter"><option value="">Toutes les villes</option></select>
<label><input type="checkbox" id="showMalls" checked> Malls</label>
<label><input type="checkbox" id="showMarjane" checked> Marjane</label>
<div id="mall-list"></div>
</div>

<div class="main">
<div id="map"></div>
</div>

</div>

<div class="detail-panel" id="detail-panel">
<button id="close-detail">Fermer</button>
<h2 id="mall-title"></h2>
<p id="mall-city"></p>
<p id="mall-address"></p>
<p><strong>Coordonnées:</strong> <span id="mall-coords"></span></p>
<h3>Magasins</h3>
<ul id="stores"></ul>
<h3>Fast Food</h3>
<ul id="fastfoods"></ul>
</div>

<script>

const malls = [

{
id:1,
name:"Morocco Mall",
city:"Casablanca",
location:{address:"Boulevard de Biarritz",lat:33.5731,lng:-7.7076},
stores:[
"Zara","H&M","Nike","Adidas","Pull&Bear","Bershka","Stradivarius",
"Massimo Dutti","Oysho","Calzedonia","Intimissimi","Foot Locker",
"Sephora","Yves Rocher","MAC Cosmetics","Lacoste","Guess",
"Tommy Hilfiger","Levi’s","Diesel","Swatch","Pandora",
"Virgin Megastore","Miniso","Claire’s","Celio","Kiabi",
"Mango","Aldo","Skechers","Samsung Store","Apple Reseller",
"Carrefour Market"
],
fastfood:["McDonald's","KFC","Burger King","Pizza Hut","Subway"],
type:"mall"
},

{
id:2,
name:"Mega Mall",
city:"Rabat",
location:{address:"Avenue Mohamed VI",lat:34.0209,lng:-6.8416},
stores:[
"Carrefour","LC Waikiki","Defacto","Adidas","Nike",
"Zara","Mango","Celio","Pimkie","Yves Rocher",
"Electroplanet","Miniso","Swatch","Bershka",
"Pull&Bear","Stradivarius"
],
fastfood:["Burger King","KFC"],
type:"mall"
},

{
id:3,
name:"Menara Mall",
city:"Marrakech",
location:{address:"Avenue Mohammed VI",lat:31.6145,lng:-8.0216},
stores:[
"Puma","Zara","Adidas","Mango","LC Waikiki",
"Carrefour Market","Celio","Bershka","Stradivarius",
"Miniso","Defacto","Electroplanet"
],
fastfood:["KFC","Pizza Hut"],
type:"mall"
},

{
id:4,
name:"Marjane Casablanca",
city:"Casablanca",
location:{address:"Ain Sebaa",lat:33.6167,lng:-7.575},
stores:[
"Marjane Hypermarket","Electroplanet","Kiabi","Decathlon",
"Inwi","Orange","Samsung Store","Yves Rocher",
"Pharmacie","Optique","Bijouterie","Presse & Librairie"
],
fastfood:["KFC"],
type:"marjane"
}

];

const mallListEl=document.getElementById("mall-list");
const searchInput=document.getElementById("search");
const cityFilter=document.getElementById("cityFilter");
const showMalls=document.getElementById("showMalls");
const showMarjane=document.getElementById("showMarjane");

let map,markerCluster;

[...new Set(malls.map(m=>m.city))].forEach(city=>{
const opt=document.createElement("option");
opt.value=city;
opt.textContent=city;
cityFilter.appendChild(opt);
});

function renderMalls(){
mallListEl.innerHTML="";
const search=searchInput.value.toLowerCase();
const selectedCity=cityFilter.value;

const filtered=malls.filter(m=>
m.name.toLowerCase().includes(search) &&
(selectedCity===""||m.city===selectedCity) &&
((m.type==="mall"&&showMalls.checked)||(m.type==="marjane"&&showMarjane.checked))
);

filtered.forEach(m=>{
const card=document.createElement("div");
card.className="mall-card";
card.innerHTML=`<strong>${m.name}</strong><br>${m.city}<br>${m.stores.length} magasins - ${m.fastfood.length} fast food`;
card.onclick=()=>showDetail(m);
mallListEl.appendChild(card);
});

renderMap(filtered);
}

function renderMap(filteredMalls){
if(map) map.remove();
map=L.map('map').setView([33.5731,-7.7076],5);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
markerCluster=L.markerClusterGroup();

filteredMalls.forEach(m=>{
const marker=L.marker([m.location.lat,m.location.lng])
.bindPopup(`<b>${m.name}</b><br>${m.location.address}<br>${m.stores.length} magasins`);
markerCluster.addLayer(marker);
});

map.addLayer(markerCluster);
}

function showDetail(m){
document.getElementById("detail-panel").style.display="block";
document.getElementById("mall-title").textContent=m.name;
document.getElementById("mall-city").textContent="Ville: "+m.city;
document.getElementById("mall-address").textContent="Adresse: "+m.location.address;
document.getElementById("mall-coords").textContent=`${m.location.lat}, ${m.location.lng}`;

const stores=document.getElementById("stores");
const fastfoods=document.getElementById("fastfoods");
stores.innerHTML="";
fastfoods.innerHTML="";

m.stores.forEach(s=>stores.innerHTML+=`<li>${s}</li>`);
m.fastfood.forEach(f=>fastfoods.innerHTML+=`<li>${f}</li>`);

map.setView([m.location.lat,m.location.lng],15);
}

document.getElementById("close-detail")
.addEventListener("click",()=>document.getElementById("detail-panel").style.display="none");

searchInput.addEventListener("input",renderMalls);
cityFilter.addEventListener("change",renderMalls);
showMalls.addEventListener("change",renderMalls);
showMarjane.addEventListener("change",renderMalls);

renderMalls();

</script>
</body>
</html>
