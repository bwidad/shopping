<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>MARKET</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Arial;
margin:0;
background:#f1f3f6;
}

/* HEADER */

header{
background:linear-gradient(90deg,#ff6f00,#ff9800);
color:white;
padding:25px;
text-align:center;
}

h1{
margin:0;
font-size:42px;
letter-spacing:5px;
}

/* CONTAINER */

.container{
max-width:1100px;
margin:auto;
padding:20px;
}

/* ACCORDION */

.accordion{
margin-bottom:15px;
border-radius:8px;
overflow:hidden;
box-shadow:0 3px 10px rgba(0,0,0,0.2);
}

.accordion-header{
padding:15px;
color:white;
font-size:20px;
cursor:pointer;
}

/* COLORS */

.chocolat{background:#5d4037;}
.biscuit{background:#1565c0;}
.chips{background:#2e7d32;}
.boisson{background:#6a1b9a;}

/* CONTENT */

.content{
display:none;
background:white;
padding:15px;
}

/* PRODUCT */

.product{
display:flex;
align-items:center;
background:#f9f9f9;
margin-bottom:10px;
padding:10px;
border-radius:6px;
}

.product img{
width:60px;
height:60px;
object-fit:contain;
margin-right:15px;
}

.product h3{
margin:0;
}

.product p{
margin:3px 0;
font-size:14px;
color:#555;
}

/* FOOTER */

footer{
background:#222;
color:white;
text-align:center;
padding:20px;
}

</style>

</head>
<body>

<header>
<h1>MARKET</h1>
<p>Catalogue des marques vendues au Maroc</p>
</header>

<div class="container">

<div class="accordion">
<div class="accordion-header chocolat" onclick="toggle('chocolatList')">
🍫 Chocolat
</div>
<div id="chocolatList" class="content"></div>
</div>

<div class="accordion">
<div class="accordion-header biscuit" onclick="toggle('biscuitList')">
🍪 Biscuit
</div>
<div id="biscuitList" class="content"></div>
</div>

<div class="accordion">
<div class="accordion-header chips" onclick="toggle('chipsList')">
🥔 Chips
</div>
<div id="chipsList" class="content"></div>
</div>

<div class="accordion">
<div class="accordion-header boisson" onclick="toggle('boissonList')">
🥤 Boisson
</div>
<div id="boissonList" class="content"></div>
</div>

</div>

<footer>
© MARKET Maroc 2026
</footer>

<script>

/* DATABASE — Ajoutez jusqu'à 200 marques ici */

const products = [

/* CHOCOLAT */

{
name:"Lindt",
company:"Entreprise suisse fondée en 1845 spécialisée dans le chocolat premium.",
category:"chocolat",
image:"https://logo.clearbit.com/lindt.com"
},

{
name:"Ferrero",
company:"Entreprise italienne produisant Kinder et Ferrero Rocher.",
category:"chocolat",
image:"https://logo.clearbit.com/ferrero.com"
},

{
name:"Milka",
company:"Marque mondiale appartenant à Mondelez.",
category:"chocolat",
image:"https://logo.clearbit.com/milka.com"
},

{
name:"KitKat",
company:"Produit par Nestlé.",
category:"chocolat",
image:"https://logo.clearbit.com/kitkat.com"
},

{
name:"Toblerone",
company:"Chocolat suisse célèbre.",
category:"chocolat",
image:"https://logo.clearbit.com/toblerone.com"
},

/* BISCUIT */

{
name:"Oreo",
company:"Biscuit produit par Mondelez.",
category:"biscuit",
image:"https://logo.clearbit.com/oreo.com"
},

{
name:"LU",
company:"Entreprise française de biscuit.",
category:"biscuit",
image:"https://logo.clearbit.com/lu.fr"
},

{
name:"Bimo",
company:"Entreprise marocaine de biscuit.",
category:"biscuit",
image:"https://logo.clearbit.com/bimo.ma"
},

{
name:"Lotus",
company:"Entreprise belge de biscuit.",
category:"biscuit",
image:"https://logo.clearbit.com/lotusbakeries.com"
},

/* CHIPS */

{
name:"Lay's",
company:"Entreprise américaine PepsiCo.",
category:"chips",
image:"https://logo.clearbit.com/lays.com"
},

{
name:"Pringles",
company:"Entreprise Kellogg's.",
category:"chips",
image:"https://logo.clearbit.com/pringles.com"
},

{
name:"Doritos",
company:"Produit PepsiCo.",
category:"chips",
image:"https://logo.clearbit.com/doritos.com"
},

{
name:"Cheetos",
company:"Produit PepsiCo.",
category:"chips",
image:"https://logo.clearbit.com/cheetos.com"
},

/* BOISSON */

{
name:"Coca-Cola",
company:"Entreprise américaine de boisson.",
category:"boisson",
image:"https://logo.clearbit.com/coca-cola.com"
},

{
name:"Pepsi",
company:"Entreprise PepsiCo.",
category:"boisson",
image:"https://logo.clearbit.com/pepsi.com"
},

{
name:"Hawai",
company:"Boisson populaire au Maroc.",
category:"boisson",
image:"https://logo.clearbit.com/hawai.ma"
},

{
name:"Poms",
company:"Boisson gazeuse marocaine.",
category:"boisson",
image:"https://logo.clearbit.com/poms.ma"
}

];


/* DISPLAY */

function display(){

products.forEach(product=>{

const html = `
<div class="product">
<img src="${product.image}">
<div>
<h3>${product.name}</h3>
<p>${product.company}</p>
</div>
</div>
`;

document.getElementById(product.category+"List").innerHTML += html;

});

}

display();

/* TOGGLE */

function toggle(id){

const el = document.getElementById(id);

el.style.display =
el.style.display === "block" ? "none" : "block";

}

</script>

</body>
</html>
