<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Malls & Marjane Maroc - Détails Complets</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.5/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.5/dist/leaflet.js"></script>

<style>
/* ===== Fond d'écran et style global ===== */
body{
margin:0;
font-family:Arial, sans-serif;
/* Fond d'écran depuis Internet */
background: url('https://images.unsplash.com/photo-1503264116251-35a269479413?auto=format&fit=crop&w=1470&q=80') no-repeat center center fixed;
background-size: cover;
color:white;
}

header{
background:rgba(2,48,71,0.8); /* semi-transparent pour lisibilité */
color:white;
padding:15px;
text-align:center;
}

.container{
display:flex;
height:90vh;
backdrop-filter: blur(3px); /* effet léger derrière le sidebar */
}

.sidebar{
width:380px;
background:rgba(255,255,255,0.9); /* semi-transparent */
overflow-y:auto;
padding:10px;
border-radius:10px;
color:black;
}

.mall-card{
background:rgba(241,241,241,0.9);
padding:10px;
margin-bottom:12px;
border-radius:8px;
box-shadow:0 4px 8px rgba(0,0,0,0.2);
}

.mall-card img{
width:100%;
border-radius:8px;
margin-bottom:8px;
}

.main{flex:1;}
#map{height:100%;}
</style>
</head>
<body>

<header>
<h2>Malls & Centres Marjane du Maroc</h2>
</header>

<div class="container">
<div class="sidebar" id="mallList"></div>
<div class="main"><div id="map"></div></div>
</div>

<script>

const malls=[

{
name:"Morocco Mall",
city:"Casablanca",
hours:"10:00 - 22:00",
lat:33.5731,lng:-7.7076,
image:"https://upload.wikimedia.org/wikipedia/commons/5/5d/Morocco_Mall.jpg",
stores:["Zara","H&M","Nike","Adidas","Sephora","Samsung Store","Virgin Megastore"],
restaurants:["McDonald's","KFC","Burger King","Pizza Hut","Starbucks","Paul"]
},

{
name:"AnfaPlace Mall",
city:"Casablanca",
hours:"10:00 - 21:30",
lat:33.5993,lng:-7.6680,
image:"https://upload.wikimedia.org/wikipedia/commons/6/63/AnfaPlace_Mall.jpg",
stores:["Zara","Pull&Bear","Massimo Dutti","Adidas"],
restaurants:["Starbucks","Pizza Hut","McDonald's"]
},

{
name:"Mega Mall",
city:"Rabat",
hours:"10:00 - 22:00",
lat:34.0209,lng:-6.8416,
image:"https://upload.wikimedia.org/wikipedia/commons/3/3b/Mega_Mall_Rabat.jpg",
stores:["LC Waikiki","Carrefour","Adidas","Yves Rocher"],
restaurants:["Burger King","Pizza Hut","Starbucks","O’Tacos"]
},

{
name:"Menara Mall",
city:"Marrakech",
hours:"10:00 - 22:00",
lat:31.6145,lng:-8.0216,
image:"https://upload.wikimedia.org/wikipedia/commons/8/83/Menara_Mall_Marrakech.jpg",
stores:["Zara","Mango","LC Waikiki","Electroplanet"],
restaurants:["KFC","McDonald's","Starbucks","Paul"]
},

{
name:"Ibn Battouta Mall",
city:"Tanger",
hours:"10:00 - 22:00",
lat:35.7595,lng:-5.8339,
image:"https://upload.wikimedia.org/wikipedia/commons/2/2c/Ibn_Battouta_Mall.jpg",
stores:["Zara","Adidas","Nike","Miniso"],
restaurants:["Burger King","KFC","Starbucks"]
},

{
name:"Borj Fez Mall",
city:"Fès",
hours:"10:00 - 21:30",
lat:34.0331,lng:-5.0033,
image:"https://upload.wikimedia.org/wikipedia/commons/4/4c/Borj_Fez_Mall.jpg",
stores:["Zara","LC Waikiki","Marwa","Adidas"],
restaurants:["McDonald's","Pizza Hut","Starbucks"]
},

// ===== MARJANE =====
{
name:"Marjane Ain Sebaa",
city:"Casablanca",
hours:"09:00 - 22:00",
lat:33.6167,lng:-7.5750,
image:"https://upload.wikimedia.org/wikipedia/commons/1/19/Marjane_Morocco.jpg",
stores:["Marjane Hypermarket","Decathlon","Kiabi","Samsung Store"],
restaurants:["KFC","Pizza Hut","Snack Express"]
},

{
name:"Marjane Rabat",
city:"Rabat",
hours:"09:00 - 22:00",
lat:34.0400,lng:-6.8300,
image:"https://upload.wikimedia.org/wikipedia/commons/1/19/Marjane_Morocco.jpg",
stores:["Marjane Hypermarket","Electroplanet","Defacto"],
restaurants:["Burger King","Starbucks"]
},

{
name:"Marjane Marrakech",
city:"Marrakech",
hours:"09:00 - 22:00",
lat:31.6295,lng:-8.0083,
image:"https://upload.wikimedia.org/wikipedia/commons/1/19/Marjane_Morocco.jpg",
stores:["Marjane Hypermarket","Decathlon","LC Waikiki"],
restaurants:["KFC","Pizza Hut"]
}

];

const mallList=document.getElementById("mallList");

let map=L.map('map').setView([33.7,-7],6);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

malls.forEach(m=>{

// Sidebar card
const div=document.createElement("div");
div.className="mall-card";
div.innerHTML=`
<img src="${m.image}" alt="${m.name}">
<h3>${m.name}</h3>
📍 ${m.city}<br>
🕒 ${m.hours}<br><br>
<b>Magasins :</b><br>
${m.stores.join(", ")}<br><br>
<b>Restaurants :</b><br>
${m.restaurants.join(", ")}
`;
mallList.appendChild(div);

// Map marker
L.marker([m.lat,m.lng])
.addTo(map)
.bindPopup(`
<b>${m.name}</b><br>
📍 ${m.city}<br>
🕒 ${m.hours}<br><br>
<b>Magasins :</b><br>
${m.stores.join(", ")}<br><br>
<b>Restaurants :</b><br>
${m.restaurants.join(", ")}
`);

});

</script>

</body>
</html>
