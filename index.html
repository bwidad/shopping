<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Malls & Marjane Maroc - Moderne</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.5/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>

<style>
:root{
  --primary:#0a9396;
  --dark:#023047;
  --text:#222;
  --white:#fff;
}

/* Arrière-plan moderne */
body{
  background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
  color: var(--text);
  font-family:'Segoe UI',Tahoma,sans-serif;
  margin:0;
  padding:0;
}

header{
  background: var(--dark);
  color: var(--white);
  padding:1rem;
  text-align:center;
}
header h1{font-size:1.8rem;}
header p{font-size:0.9rem;}

.container{
  display:flex;
  flex-direction:row;
  height:calc(100vh - 80px);
}
.sidebar{
  width:350px;
  overflow-y:auto;
  background: rgba(255,255,255,0.95);
  padding:1rem;
  box-shadow:2px 0 12px rgba(0,0,0,0.15);
}
.main{
  flex:1;
  display:flex;
  flex-direction:column;
  position:relative;
}
.controls{
  display:flex;
  gap:0.5rem;
  flex-wrap:wrap;
  margin-bottom:0.5rem;
}
.controls input,.controls select{
  padding:0.5rem;
  border:1px solid #aaa;
  border-radius:5px;
}
.controls label{
  display:flex;
  align-items:center;
  gap:0.2rem;
  font-weight:500;
}
#mall-list{
  display:grid;
  grid-template-columns:1fr;
  gap:0.8rem;
}
.mall-card{
  background: rgba(255,255,255,0.95);
  border-radius:8px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.2);
  cursor:pointer;
  transition:0.3s;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}
.mall-card:hover{
  transform:translateY(-2px);
  box-shadow:0 6px 20px rgba(0,0,0,0.25);
}
.mall-card img{
  width:100%;
  height:100px;
  object-fit:cover;
}
.mall-card .info{
  padding:0.5rem;
}
.mall-card h3{
  color:var(--primary);
  font-size:1rem;
  margin-bottom:0.2rem;
}
.mall-card p{
  font-size:0.8rem;
  margin:0.1rem 0;
}
.bar-container{
  display:flex;
  height:5px;
  width:100%;
  background:#eee;
  border-radius:3px;
  overflow:hidden;
  margin-top:3px;
}
.bar-fill{
  background:var(--primary);
  height:100%;
}

#map{flex:1;border-radius:8px;}

.detail-panel{
  position:absolute;
  top:60px;
  left:50%;
  transform:translateX(-50%);
  width:90%;
  max-width:600px;
  background: rgba(255,255,255,0.98);
  padding:1rem;
  border-radius:10px;
  box-shadow:0 6px 25px rgba(0,0,0,0.3);
  display:none;
  z-index:1000;
  transition:0.3s;
}
.detail-panel h2{margin-bottom:0.3rem;}
.detail-panel p{font-size:0.85rem;margin:0.2rem 0;}
.detail-panel .store-list{
  padding-left:1rem;
  margin-top:0.5rem;
}
.detail-panel button{
  margin-top:0.5rem;
  padding:0.4rem 0.8rem;
  border:none;
  background:var(--primary);
  color:var(--white);
  border-radius:5px;
  cursor:pointer;
}

footer{
  text-align:center;
  padding:0.5rem;
  background:#ddd;
  font-size:0.8rem;
}
@media(max-width:900px){
  .container{flex-direction:column;height:auto;}
  .sidebar{width:100%;max-height:300px;}
  .main{height:400px;}
}
</style>
</head>
<body>

<header>
<h1>Dashboard Malls & Marjane Maroc</h1>
<p>Carte interactive avec clusters, fast-food et design moderne</p>
</header>

<div class="container">
<div class="sidebar">
<div class="controls">
<input type="text" id="search" placeholder="Rechercher un mall...">
<select id="cityFilter"><option value="">Toutes les villes</option></select>
<label><input type="checkbox" id="showMalls" checked> Malls</label>
<label><input type="checkbox" id="showMarjane" checked> Marjane</label>
</div>
<div id="mall-list"></div>
</div>
<div class="main">
<div id="map"></div>
</div>
</div>

<div class="detail-panel" id="detail-panel">
<button id="close-detail">✕ Fermer</button>
<h2 id="mall-title"></h2>
<p id="mall-city"></p>
<p id="mall-address"></p>
<p><strong>Coordonnées:</strong> <span id="mall-coords"></span></p>
<h3>Magasins:</h3>
<ul id="stores" class="store-list"></ul>
<h3>Fast-Food:</h3>
<ul id="fastfoods" class="store-list"></ul>
</div>

<footer>© 2026 - Dashboard Moderne Malls & Marjane</footer>

<script src="https://unpkg.com/leaflet@1.9.5/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

<script>
// DONNÉES AVEC FAST FOOD
const malls = [
  { id:1,name:"Morocco Mall",city:"Casablanca",image:"https://source.unsplash.com/800x500/?mall,casablanca",location:{address:"Boulevard de Biarritz",lat:33.5731,lng:-7.7076},stores:["Zara","H&M","Nike"],fastfood:["McDonald's","KFC"],type:"mall" },
  { id:2,name:"Anfaplace Shopping Center",city:"Casablanca",image:"https://source.unsplash.com/800x500/?shopping-center,casablanca",location:{address:"Boulevard de la Corniche",lat:33.5992,lng:-7.6647},stores:["Mango","Calvin Klein"],fastfood:["Subway"],type:"mall" },
  { id:3,name:"Mega Mall",city:"Rabat",image:"https://source.unsplash.com/800x500/?mall,rabat",location:{address:"Avenue Mohamed VI",lat:34.0209,lng:-6.8416},stores:["LC Waikiki","Carrefour"],fastfood:["Burger King"],type:"mall" },
  { id:4,name:"Menara Mall",city:"Marrakech",image:"https://source.unsplash.com/800x500/?mall,marrakech",location:{address:"Avenue Mohammed VI",lat:31.6145,lng:-8.0216},stores:["Puma","Zara"],fastfood:["KFC","Pizza Hut"],type:"mall" },
  { id:5,name:"Tanger City Mall",city:"Tanger",image:"https://source.unsplash.com/800x500/?mall,tanger",location:{address:"Route de Malabata",lat:35.7733,lng:-5.7766},stores:["Nike","Defacto"],fastfood:["McDonald's"],type:"mall" },
  { id:6,name:"Marjane Casablanca Ain Sebaa",city:"Casablanca",image:"https://source.unsplash.com/800x500/?marjane,casablanca",location:{address:"Ain Sebaa",lat:33.6167,lng:-7.575},stores:["Marjane","Carrefour"],fastfood:["KFC"],type:"marjane" },
  { id:7,name:"Marjane Rabat Agdal",city:"Rabat",image:"https://source.unsplash.com/800x500/?marjane,rabat",location:{address:"Agdal",lat:34.0267,lng:-6.835},stores:["Marjane Hyper","Electro"],fastfood:["Pizza Hut"],type:"marjane" },
  { id:8,name:"Marjane Marrakech Guéliz",city:"Marrakech",image:"https://source.unsplash.com/800x500/?marjane,marrakech",location:{address:"Guéliz",lat:31.631,lng:-8.008},stores:["Marjane","Mode"],fastfood:["Burger King"],type:"marjane" }
];

// DOM
const mallListEl=document.getElementById("mall-list");
const searchInput=document.getElementById("search");
const cityFilter=document.getElementById("cityFilter");
const showMalls=document.getElementById("showMalls");
const showMarjane=document.getElementById("showMarjane");

const detailPanel=document.getElementById("detail-panel");
const closeDetail=document.getElementById("close-detail");
const mallTitle=document.getElementById("mall-title");
const mallCity=document.getElementById("mall-city");
const mallAddress=document.getElementById("mall-address");
const mallCoords=document.getElementById("mall-coords");
const storesEl=document.getElementById("stores");
const fastfoodsEl=document.getElementById("fastfoods");

let map,markerCluster;

// INIT FILTRES
[...new Set(malls.map(m=>m.city))].forEach(city=>{
  const opt=document.createElement("option");
  opt.value=city;
  opt.textContent=city;
  cityFilter.appendChild(opt);
});

// RENDER LIST & MAP
function renderMalls(){
  mallListEl.innerHTML="";
  const search=searchInput.value.toLowerCase();
  const selectedCity=cityFilter.value;
  const filtered=malls.filter(m=>m.name.toLowerCase().includes(search) &&
    (selectedCity===""||m.city===selectedCity) &&
    ((m.type==="mall" && showMalls.checked)||(m.type==="marjane" && showMarjane.checked))
  );

  filtered.forEach(m=>{
    const card=document.createElement("div"); card.className="mall-card";
    card.innerHTML=`<img src="${m.image}" alt="${m.name}"><div class="info"><h3>${m.name}</h3><p>${m.city}</p><p>${m.stores.length} magasins, ${m.fastfood.length} fast-food</p><div class="bar-container"><div class="bar-fill" style="width:${Math.min((m.stores.length+m.fastfood.length)*10,100)}%"></div></div></div>`;
    card.onclick=()=>showDetail(m);
    mallListEl.appendChild(card);
  });

  renderMap(filtered);
}

// RENDER MAP AVEC CLUSTER
function renderMap(filteredMalls){
  if(map) map.remove();
  map=L.map('map').setView([33.5731,-7.7076],5);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);
  markerCluster=L.markerClusterGroup();
  filteredMalls.forEach(m=>{
    const icon=L.divIcon({html:m.type==="marjane"?"🛒":"🏬",className:"",iconSize:[30,30],iconAnchor:[15,15]});
    const marker=L.marker([m.location.lat,m.location.lng],{icon:icon}).bindPopup(`<b>${m.name}</b><br>${m.location.address}`);
    markerCluster.addLayer(marker);
  });
  map.addLayer(markerCluster);
  if(cityFilter.value){
    const cityMalls=filteredMalls.filter(m=>m.city===cityFilter.value);
    if(cityMalls.length){
      const bounds=L.latLngBounds(cityMalls.map(m=>[m.location.lat,m.location.lng]));
      map.fitBounds(bounds,{padding:[50,50]});
    }
  }
}

// SHOW DETAIL
function showDetail(m){
  detailPanel.style.display="block";
  mallTitle.textContent=m.name;
  mallCity.textContent="Ville: "+m.city;
  mallAddress.textContent="Adresse: "+m.location.address;
  mallCoords.textContent=`Lat: ${m.location.lat}, Lng: ${m.location.lng}`;
  storesEl.innerHTML=""; fastfoodsEl.innerHTML="";
  m.stores.forEach(s=>{const li=document.createElement("li");li.textContent=s;storesEl.appendChild(li);});
  m.fastfood.forEach(f=>{const li=document.createElement("li");li.textContent=f;fastfoodsEl.appendChild(li);});
  map.setView([m.location.lat,m.location.lng],15);
}

// EVENTS
searchInput.addEventListener("input",renderMalls);
cityFilter.addEventListener("change",renderMalls);
showMalls.addEventListener("change",renderMalls);
showMarjane.addEventListener("change",renderMalls);
closeDetail.addEventListener("click",()=>detailPanel.style.display="none");

// INIT
renderMalls();
</script>
</body>
</html>
